name: Update Profile Views

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

env:
  COLOR: 00ff00

jobs:
  update-profile-views:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Update Profile Views
        run: |
          VIEWS="$(curl -s "https://api.github.com/repos/${{ github.repository }}/traffic/views" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            2>/dev/null | jq '.count')"

          echo '<svg xmlns="http://www.w3.org/2000/svg" 
          xmlns:xlink="http://www.w3.org/1999/xlink" 
          width="214" height="20" role="img" 
          aria-label="GitHub Profile Views: '"$VIEWS"'">
          <title>GitHub Profile Views: '"$VIEWS"'</title>
          <linearGradient id="s" x2="0" y2="100%">
            <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
            <stop offset="1" stop-opacity=".1"/>
          </linearGradient>
          <clipPath id="r">
            <rect width="214" height="20" rx="3" fill="#'"${COLOR}"'"/>
          </clipPath>
          <g clip-path="url(#r)">
            <rect width="183" height="20" fill="#000"/>
            <rect x="183" width="31" height="20" fill="#4c1"/>
            <rect width="214" height="20" fill="url(#s)"/>
          </g>
          <g fill="#fff" text-anchor="middle" 
          font-family="Verdana,Geneva,DejaVu Sans,sans-serif" 
          text-rendering="geometricPrecision" font-size="110">
            <text x="925" y="150" fill="#010101" fill-opacity=".3" 
            transform="scale(.1)" textLength="1730">GitHub Profile Views</text>
            <text x="925" y="140" transform="scale(.1)" 
            fill="#fff" textLength="1730">GitHub Profile Views</text>
            <text x="1975" y="150" fill="#010101" fill-opacity=".3" 
            transform="scale(.1)" textLength="210">'"$VIEWS"'</text>
            <text x="1975" y="140" transform="scale(.1)" 
            fill="#000" textLength="210">'"$VIEWS"'</text>
          </g></svg>' > profile-views.svg

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git pull
          git add -A
          git diff-index --quiet HEAD || git commit -m "Update profile views to ${VIEWS}"
          git push
